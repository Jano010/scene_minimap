<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minimapa — previsualizacion</title>
<link rel="stylesheet" href="../styles/minimap.css">
<style>
  body { margin: 0; padding: 24px; background: #1b1d2a; font-family: system-ui, sans-serif;
         display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-bottom: 8px; font-size: 12px; color: #9aa0b5; }
  .mm-root { width: 232px; }
  .note { flex-basis: 100%; margin: 0 0 4px; color: #6f7590; font-size: 12px; }
</style>
</head>
<body>
<p class="note">Previsualizacion del aspecto, sin Owlbear. Solo para ajustar el estilo.
  <label style="margin-left:12px"><input type="checkbox" id="z"> aumentar &times;2.5</label></p>
<div id="out"></div>
<script type="module">
// Piezas de mentira: cuadrados con una habitacion dibujada.
const room = (w, h, fill) => "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
     <rect width="100%" height="100%" fill="${fill}"/>
     <rect x="6" y="6" width="${w-12}" height="${h-12}" fill="none" stroke="#000" stroke-width="3" opacity=".5"/>
     <g stroke="#000" stroke-width="1" opacity=".18">
       ${Array.from({length: Math.floor(w/20)}, (_,i)=>`<line x1="${i*20}" y1="0" x2="${i*20}" y2="${h}"/>`).join("")}
       ${Array.from({length: Math.floor(h/20)}, (_,i)=>`<line x1="0" y1="${i*20}" x2="${w}" y2="${i*20}"/>`).join("")}
     </g>
   </svg>`);

const svg = d => `<svg viewBox="0 0 24 24" width="11" height="11" fill="none"
  stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
  style="display:block;margin:auto">${d}</svg>`;
const ICON = {
  eye: svg('<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>'),
  eyeOff: svg('<path d="M3 3l18 18"/><path d="M10.6 6.1C11.05 6.03 11.5 6 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.2 3.9"/><path d="M6.3 8.1A18 18 0 0 0 2 12s3.5 6 10 6c1.2 0 2.3-.2 3.3-.5"/>'),
  gear: svg('<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 8.5l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 3.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/>'),
  close: svg('<path d="M5 5l14 14M19 5L5 19"/>')
};

const pieces = [
  { x: 0,   y: 0,  w: 96,  h: 78, fill: "#8a7f6a", cls: "" },
  { x: 96,  y: 14, w: 64,  h: 52, fill: "#7d7360", cls: "mm-current" },
  { x: 160, y: 0,  w: 70,  h: 78, fill: "#6f6757", cls: "mm-veiled" }
];
const dots = [
  { x: 38, y: 40, c: "#4ec9f5", cls: "mm-selected" },
  { x: 52, y: 52, c: "#5bd66f", cls: "" },
  { x: 126, y: 40, c: "#f5544e", cls: "" },
  { x: 140, y: 30, c: "#f5544e", cls: "mm-dim" }
];

const panel = (theme, title) => `
  <figure>
    <figcaption>${title}</figcaption>
    <div class="mm-root mm-theme-${theme}">
      <div class="mm-toolbar">
        <span class="mm-title">Explorado 2/3</span>
        ${["eye","eyeOff","gear","close"].map(i => `<button class="mm-btn" style="opacity:1">${ICON[i]}</button>`).join("")}
      </div>
      <div class="mm-frame mm-items mm-gm" style="width:220px; height:110px">
        <div class="mm-canvas" style="width:230px; height:78px; left:-5px; top:16px">
          ${pieces.map(p => `<img class="mm-piece ${p.cls}" src="${room(p.w, p.h, p.fill)}"
              style="left:${p.x}px; top:${p.y}px; width:${p.w}px; height:${p.h}px">`).join("")}
          <div class="mm-viewport" style="left:20px; top:8px; width:86px; height:56px"></div>
          ${dots.map(d => `<span class="mm-dot ${d.cls}" style="left:${d.x}px; top:${d.y}px; background:${d.c}"></span>`).join("")}
          <span class="mm-marker" style="left:150px; top:50px"></span>
        </div>
      </div>
    </div>
  </figure>`;

document.getElementById("out").outerHTML =
  panel("parchment", "Pergamino") + panel("dark", "Oscuro");

document.getElementById("z").addEventListener("change", e => {
  document.querySelectorAll("figure").forEach(f => {
    f.style.zoom = e.target.checked ? 2.5 : 1;
  });
});
</script>
</body>
</html>
